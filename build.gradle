allprojects {
    group = 'com.destroystokyo.paper'
    version = '1.12.2-R0.1-SNAPSHOT'
    description = 'Antarctic: a patch-based Paper 1.12.2 fork'
}

subprojects {
    apply plugin: 'java-library'
    java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
        doFirst {
            if (!file('src/main/java').isDirectory()) {
                throw new GradleException('Initialize local sources with setupSources first.')
            }
        }
    }
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
    repositories {
        mavenCentral()
        maven { url = 'https://libraries.minecraft.net/' }
        maven { url = 'https://repo.aikar.co/content/groups/aikar/' }
        maven { url = 'https://repo.md-5.net/content/repositories/releases/' }
        maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
        maven { url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
    }
    tasks.named('compileJava') {
        doFirst {
            if (!rootProject.file('Antarctic-Server/libs/minecraft-server-1.12.2-mapped.jar').exists()) {
                throw new GradleException('Run setupSources before building.')
            }
        }
    }
}

def bash = providers.gradleProperty('bashExecutable').getOrElse(System.getenv('BASH_EXECUTABLE') ?: 'bash')
['setupSources': 'setup', 'applyPatches': 'apply', 'rebuildPatches': 'rebuild'].each { taskName, action ->
    tasks.register(taskName, Exec) {
        group = 'patching'
        description = [setup: 'Generate ignored local sources from pinned Paper and apply Antarctic patches.',
                       apply: 'Reset clean local source repositories and apply Antarctic patches.',
                       rebuild: 'Export committed local source changes into patches/.'][action]
        workingDir rootDir
        commandLine bash, 'scripts/patches.sh', action
        if (action == 'setup' && providers.gradleProperty('upstreamDir').isPresent()) {
            args providers.gradleProperty('upstreamDir').get()
        }
    }
}

tasks.register('buildApi') {
    group = 'build'
    description = 'Builds the Antarctic API JAR archive.'
    dependsOn ':Antarctic-API:jar'
}

tasks.register('buildServer') {
    group = 'build'
    description = 'Builds the Antarctic Server module JAR.'
    dependsOn ':Antarctic-Server:jar'
}

tasks.register('buildServerJar') {
    group = 'build'
    description = 'Builds the complete runnable Antarctic server JAR archive.'
    dependsOn ':Antarctic-Server:serverJar'
}

tasks.register('paperclip', Exec) {
    group = 'build'
    description = 'Builds the upstream Paperclip executable JAR wrapper.'
    workingDir rootDir
    commandLine bash, 'scripts/upstream/paperclip.sh', rootDir.absolutePath
}

tasks.register('testServer', Exec) {
    group = 'verification'
    description = 'Runs or prepares the local test server environment.'
    workingDir rootDir
    commandLine bash, 'scripts/upstream/testServer.sh', rootDir.absolutePath
}

tasks.register('applyUpstreamPatches', Exec) {
    group = 'patching'
    description = 'Applies upstream Spigot patches to CraftBukkit/NMS.'
    workingDir rootDir
    commandLine bash, 'scripts/upstream/applyPatches.sh', rootDir.absolutePath
}

tasks.register('rebuildUpstreamPatches', Exec) {
    group = 'patching'
    description = 'Rebuilds upstream Spigot patches from work/CraftBukkit.'
    workingDir rootDir
    commandLine bash, 'scripts/upstream/rebuildPatches.sh', rootDir.absolutePath
}
