name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Configure git identity for patch application
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Set up JDK 8 (legacy source generation)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'

      - name: Record JDK 8 home
        run: echo "JAVA8_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache pinned Paper upstream state
        uses: actions/cache@v6
        with:
          path: |
            .upstream
            ~/.m2/repository
          key: upstream-e39995d213616cc7d60c38e6e86e562f30637ef7-v1

      - name: Generate sources and apply patches
        run: ./gradlew setupSources
        env:
          JAVA8_HOME: ${{ env.JAVA8_HOME }}

      - name: Build server jar
        run: ./gradlew buildServerJar

      - name: Build paperclip (optional; requires upstream workdir layout)
        run: ./gradlew paperclip
        continue-on-error: true

      - name: Upload jar artifact
        uses: actions/upload-artifact@v7
        with:
          name: antarctic-${{ github.ref_name }}
          path: Antarctic-Server/build/libs/Antarctic-b*.jar

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Antarctic ${{ github.ref_name }}" \
            --generate-notes \
            Antarctic-Server/build/libs/Antarctic-b*.jar
