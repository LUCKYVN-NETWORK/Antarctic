/*
 * Antarctic-Server - the overhauled Paper server module.
 *
 * Compiles patched Paper/CraftBukkit classes against the local mapped jar.
 * Full decompiled NMS sources remain separate, ignored reference material.
 */

dependencies {
    api project(':Antarctic-API')

    // Remapped vanilla 1.12.2 server (upstream: org.spigotmc:minecraft-server:1.12.2-SNAPSHOT).
    // Unpatched NMS classes come from this jar at compile time; their decompiled
    // sources are kept for reference under mc-dev/ (upstream makemcdevsrc layout).
    compileOnly files('libs/minecraft-server-1.12.2-mapped.jar')

    implementation 'io.netty:netty-all:4.1.24.Final'
    implementation 'net.sf.jopt-simple:jopt-simple:5.0.4'
    implementation 'org.xerial:sqlite-jdbc:3.21.0.1'
    implementation 'mysql:mysql-connector-java:5.1.45'
    implementation 'net.sf.trove4j:trove4j:3.0.3'
    implementation 'net.minecrell:terminalconsoleappender:1.1.1'
    implementation 'net.java.dev.jna:jna:4.5.2'
    implementation 'org.apache.logging.log4j:log4j-core:2.17.0'
    implementation 'org.apache.logging.log4j:log4j-slf4j-impl:2.17.0'
    implementation 'org.apache.logging.log4j:log4j-iostreams:2.17.0'
    implementation 'com.lmax:disruptor:3.4.4'

    testImplementation files('libs/minecraft-server-1.12.2-mapped.jar')
    testImplementation 'junit:junit:4.12'
    testImplementation 'org.hamcrest:hamcrest-library:1.3'
}

jar {
    archiveBaseName = 'Antarctic-Server'
}

tasks.register('serverJar', Jar) {
    group = 'build'
    description = 'Builds the standalone runnable Antarctic server JAR archive with dependencies and mapped NMS classes.'
    archiveBaseName = 'Antarctic-Server'
    archiveClassifier = ''
    manifest {
        attributes(
            'Main-Class': 'org.bukkit.craftbukkit.Main',
            'Implementation-Title': 'Antarctic-Server',
            'Implementation-Version': project.version,
            'Specification-Title': 'Bukkit',
            'Specification-Version': project.version,
            'Specification-Vendor': 'PaperMC / Antarctic',
            'Implementation-Vendor': 'Antarctic'
        )
    }
    from sourceSets.main.output
    from project(':Antarctic-API').sourceSets.main.output
    dependsOn ':Antarctic-API:classes', 'classes'

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    def mappedJar = file('libs/minecraft-server-1.12.2-mapped.jar')
    if (mappedJar.exists()) {
        from zipTree(mappedJar)
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}
