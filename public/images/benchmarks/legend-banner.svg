  <g transform="translate(970, 20)">
    <rect x="0" y="0" width="148" height="46" rx="8" fill="#1C1633" stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="1"/>
    <rect x="12" y="16" width="14" height="14" rx="4" fill="url(#violetBar)"/>
    <text x="34" y="22" fill="#F5F3FF" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11.5" font-weight="600">Antarctic</text>
    <text x="34" y="36" fill="#C4B5FD" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10">Opt-in TOML</text>
