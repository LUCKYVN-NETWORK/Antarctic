  <text x="30" y="306.5" fill="#94A3B8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2">Throughput: 108.1 → 118.2 (+9.4% Def) / 120.4 chunks/s (+11.4% Opt) · Reload: ~1.45 ms/chunk</text>
