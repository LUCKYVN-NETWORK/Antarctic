/*
 * Antarctic-API — the overhauled Bukkit/Paper API module.
 */

dependencies {
    api 'net.sf.trove4j:trove4j:3.0.3'
    api 'com.mojang:authlib:1.5.25'
    api 'co.aikar:fastutil-lite:1.0'
    api 'commons-lang:commons-lang:2.6'
    api 'com.googlecode.json-simple:json-simple:1.1.1'
    api 'com.google.code.findbugs:jsr305:1.3.9'
    api 'com.google.guava:guava:21.0'
    api 'com.google.code.gson:gson:2.8.0'
    api 'org.yaml:snakeyaml:1.19'
    api 'net.md-5:bungeecord-chat:1.12-SNAPSHOT'
    api 'org.slf4j:slf4j-api:1.7.25'
    api 'org.ow2.asm:asm:6.1.1'
    api 'org.ow2.asm:asm-commons:6.1.1'

    testImplementation 'junit:junit:4.12'
    testImplementation 'org.hamcrest:hamcrest-library:1.3'
}

jar {
    archiveBaseName = 'Antarctic-API'
    manifest {
        attributes(
            'Implementation-Title': 'Antarctic-API',
            'Implementation-Version': project.version,
            'Specification-Title': 'Bukkit',
            'Specification-Version': project.version,
            'Specification-Vendor': 'PaperMC / Antarctic',
            'Implementation-Vendor': 'Antarctic'
        )
    }
}
